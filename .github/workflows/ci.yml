name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # weekly: catch breakage from upstream repos/packages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply playbook on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (remove preinstalled toolchains we do not need)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Remove preinstalled packages that conflict with the playbook
        run: |
          # The runner image ships Docker CE (containerd.io), which conflicts with Ubuntu's docker.io.
          sudo apt-get remove -y --purge 'docker-ce*' docker-buildx-plugin docker-compose-plugin containerd.io moby-* || true
          sudo apt-get autoremove -y

      - name: Install Ansible from the Ubuntu archive (same as on the laptop)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ansible dbus
          # The runner image also has a newer ansible-core from pipx (/opt/pipx_bin), earlier in PATH.
          sudo pipx uninstall ansible-core || true
          sudo rm -f /opt/pipx_bin/ansible*
          hash -r
          ansible --version
          ansible --version | grep -q 'python module location = /usr/lib/python3/dist-packages/ansible'

      - name: Prerequisites that exist on the laptop but not on the runner
        run: |
          # The "Autostart applications" task copies the Firefox snap's .desktop file.
          sudo snap install firefox
          mkdir -p ~/Pictures

      - name: Apply playbook
        run: dbus-run-session -- ./run.sh

      - name: Verify OOM setup
        run: |
          systemctl is-active earlyoom
          ! systemctl is-active systemd-oomd
          test "$(systemctl is-enabled systemd-oomd.service || true)" = masked
          grep -q -- '-m 4' /etc/default/earlyoom
          grep -q 'min_ttl_ms - - - - 1000' /etc/tmpfiles.d/mglru-min-ttl.conf
          if [ -e /sys/kernel/mm/lru_gen/min_ttl_ms ]; then test "$(cat /sys/kernel/mm/lru_gen/min_ttl_ms)" = 1000; fi
          journalctl -u earlyoom -n 5 --no-pager
